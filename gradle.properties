pluginVersion=0.0.10
pluginSinceBuild = 263

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin-properties.html
platformType = IU
platformVersion = 2026.3

# Java language level used to compile sources and generate class files.
javaVersion = 25

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.9.1

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# agents running tests in parallel, which is conflicting
org.gradle.caching=false

# Kotlin dependencies are declared explicitly in build.gradle.kts.
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx2g
